
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard | PropertyHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #1e293b;
        }

        .navbar-brand {
            color: #1e3a8a;
            font-size: 25px;
            font-weight: 700;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            padding: 35px;
            border-radius: 12px;
            margin-top: 30px;
        }

        .dashboard-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            height: 100%;
        }

        .dashboard-card h3 {
            color: #1e3a8a;
            font-weight: 700;
        }

        .section-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .property-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
            background: white;
        }

        .property-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #e2e8f0;
        }

        .property-details {
            padding: 20px;
        }

        .property-price {
            color: #1e3a8a;
            font-size: 21px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .detail-row {
            margin-bottom: 9px;
            font-size: 14px;
        }

        .detail-label {
            font-weight: 600;
            color: #475569;
        }
    </style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            PropertyHub
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">

            <span class="fw-semibold">
                Welcome, <span id="sellerName">Seller</span>
            </span>

            <a href="index.html" class="btn btn-outline-primary btn-sm">
                Home
            </a>

            <button class="btn btn-outline-danger btn-sm" id="logoutButton">
                Logout
            </button>

        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- Dashboard Header -->
    <div class="dashboard-header">

        <h2>Seller Dashboard</h2>

        <p class="mb-0">
            Manage your property listings easily with PropertyHub.
        </p>

    </div>

    <!-- Dashboard Statistics -->
    <div class="row g-4 mt-2">

        <div class="col-md-4">
            <div class="dashboard-card">
                <h3 id="totalProperties">0</h3>
                <p class="text-muted mb-0">Total Properties</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <h3 id="saleProperties">0</h3>
                <p class="text-muted mb-0">Properties for Sale</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <h3 id="rentProperties">0</h3>
                <p class="text-muted mb-0">Properties for Rent</p>
            </div>
        </div>

    </div>

    <!-- Add Property Section -->
    <div class="section-card">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>
                <h4 class="fw-bold">Manage Properties</h4>
                <p class="text-muted mb-0">
                    Add and manage your property listings.
                </p>
            </div>

            <a href="add-property.html" class="btn btn-primary">
                + Add New Property
            </a>

        </div>

    </div>

    <!-- My Properties -->
    <div class="section-card">

        <h4 class="fw-bold mb-3">My Properties</h4>

        <div id="propertyList" class="text-muted text-center py-4">
            Loading your properties...
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const loggedInUser = sessionStorage.getItem("loggedInUser");

        if (!loggedInUser) {
            window.location.href = "login.html";
            return;
        }

        let user;

        try {
            user = JSON.parse(loggedInUser);
        } catch (error) {
            alert("Invalid login session. Please log in again.");
            window.location.href = "login.html";
            return;
        }

        if (user.role !== "SELLER") {
            alert("Access denied! This page is for sellers only.");
            window.location.href = "index.html";
            return;
        }

        document.getElementById("sellerName").textContent =
            user.fullName || user.name || "Seller";

        document.getElementById("logoutButton")
            .addEventListener("click", function () {

                sessionStorage.removeItem("loggedInUser");
                window.location.href = "login.html";

            });

        // Load seller properties
        loadSellerProperties(user.id);

    });


    // Load all properties belonging to the logged-in seller
    async function loadSellerProperties(ownerId) {

        const propertyList = document.getElementById("propertyList");

        if (!ownerId) {
            propertyList.innerHTML =
                '<p class="text-danger">Seller ID not found. Please log in again.</p>';
            return;
        }

        try {

            const response = await fetch(
                "/api/properties/seller/" + encodeURIComponent(ownerId)
            );

            if (!response.ok) {
                throw new Error("Unable to fetch properties. HTTP status: " + response.status);
            }

            const properties = await response.json();

            console.log("Seller properties:", properties);

            if (!Array.isArray(properties)) {
                throw new Error("Invalid property data received from server.");
            }

            // Update dashboard statistics
            document.getElementById("totalProperties").textContent =
                properties.length;

            document.getElementById("saleProperties").textContent =
                properties.filter(property =>
                    String(property.listingType || "").toUpperCase() === "SALE"
                ).length;

            document.getElementById("rentProperties").textContent =
                properties.filter(property =>
                    String(property.listingType || "").toUpperCase() === "RENT"
                ).length;

            // Show empty message
            if (properties.length === 0) {

                propertyList.innerHTML = `
                    <div class="py-4">
                        <h5>No Properties Found</h5>
                        <p class="text-muted">
                            You have not added any properties yet.
                        </p>
                        <a href="add-property.html" class="btn btn-primary">
                            Add Your First Property
                        </a>
                    </div>
                `;

                return;
            }

            // Display all properties
            propertyList.className = "row g-4";

            propertyList.innerHTML = properties.map(property => {

                const status = String(property.approvalStatus || "PENDING").toUpperCase();

                let statusClass = "status-pending";

                if (status === "APPROVED") {
                    statusClass = "status-approved";
                } else if (status === "REJECTED") {
                    statusClass = "status-rejected";
                }

                const imageHTML = property.imageUrl
                    ? `<img src="${escapeHTML(property.imageUrl)}"
                            class="property-image"
                            alt="Property image"
                            onerror="this.onerror=null; this.src='https://placehold.co/600x400?text=Image+Not+Available';">`
                    : `<img src="https://placehold.co/600x400?text=No+Property+Image"
                            class="property-image"
                            alt="No property image">`;

                return `

                    <div class="col-lg-6 col-xl-4">

                        <div class="property-card">

                            ${imageHTML}

                            <div class="property-details">

                                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">

                                    <h5 class="fw-bold mb-0">
                                        ${escapeHTML(property.title || "Untitled Property")}
                                    </h5>

                                    <span class="status-badge ${statusClass}">
                                        ${escapeHTML(status)}
                                    </span>

                                </div>

                                <p class="text-muted small">
                                    ${escapeHTML(property.description || "No description available")}
                                </p>

                                <div class="property-price mb-3">
                                    ${formatPrice(property.price)}
                                </div>

                                <hr>

                                <div class="detail-row">
                                    <span class="detail-label">Property ID:</span>
                                    ${escapeHTML(property.id)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">City:</span>
                                    ${escapeHTML(property.city)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Locality:</span>
                                    ${escapeHTML(property.locality)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Property Type:</span>
                                    ${escapeHTML(property.propertyType)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Listing Type:</span>
                                    ${escapeHTML(property.listingType)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Bedrooms:</span>
                                    ${escapeHTML(property.bedrooms)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Bathrooms:</span>
                                    ${escapeHTML(property.bathrooms)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Area:</span>
                                    ${escapeHTML(property.area)} sq. ft.
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Owner:</span>
                                    ${escapeHTML(property.ownerName)}
                                </div>

                                <div class="detail-row">
                                    <span class="detail-label">Added On:</span>
                                    ${formatDate(property.createdAt)}
                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");

        } catch (error) {

            console.error("Error loading seller properties:", error);

            propertyList.className = "text-center py-4";

            propertyList.innerHTML = `
                <p class="text-danger fw-semibold">
                    Unable to load your properties.
                </p>
                <p class="text-muted">
                    ${escapeHTML(error.message)}
                </p>
                <button class="btn btn-outline-primary"
                        onclick="location.reload()">
                    Try Again
                </button>
            `;

        }

    }


    // Format price in Indian currency
    function formatPrice(price) {

        if (price === null || price === undefined) {
            return "Price not available";
        }

        return "₹" + Number(price).toLocaleString("en-IN");

    }


    // Format date
    function formatDate(date) {

        if (!date) {
            return "Not available";
        }

        const parsedDate = new Date(date);

        if (isNaN(parsedDate.getTime())) {
            return "Not available";
        }

        return parsedDate.toLocaleDateString("en-IN");

    }


    // Escape dynamic values before displaying them in HTML
    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "N/A";
        }

        return String(value).replace(/[&<>"']/g, function (character) {

            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[character];

        });

    }

</script>

</body>
</html>
