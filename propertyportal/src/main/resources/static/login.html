
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PropertyHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .brand {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .login-title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">PropertyHub</div>

    <h4 class="login-title">Welcome Back!</h4>

    <p class="text-muted text-center mb-4">
        Login to access your account
    </p>

    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label">Email Address</label>

            <input type="email"
                   id="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <input type="password"
                   id="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>
        </div>

        <div id="message" class="mb-3"></div>

        <button type="submit" class="btn-login" id="loginButton">
            Login
        </button>

    </form>

    <div class="back-link">
        <p>Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <a href="index.html">Back to Home</a>
    </div>

</div>

</body>
<script src="js/login.js"></script>
</html>
