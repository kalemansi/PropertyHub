
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account | PropertyHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .account-card {
            max-width: 550px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .account-title {
            color: #1e3a8a;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-item {
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .profile-label {
            color: #64748b;
            font-size: 14px;
        }

        .profile-value {
            color: #1e293b;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            PropertyHub
        </a>

        <a href="index.html" class="btn btn-outline-primary">
            Back to Home
        </a>
    </div>
</nav>

<div class="container">

    <div class="account-card">

        <h2 class="account-title">My Account</h2>

        <div class="text-center mb-4">
            <h5>Welcome, <span id="profileName">User</span>!</h5>
            <p class="text-muted">
                Your account information
            </p>
        </div>

        <div class="profile-item">
            <div class="profile-label">Full Name</div>
            <div class="profile-value" id="fullName">-</div>
        </div>

        <div class="profile-item">
            <div class="profile-label">Email Address</div>
            <div class="profile-value" id="email">-</div>
        </div>

        <div class="profile-item">
            <div class="profile-label">Phone Number</div>
            <div class="profile-value" id="phone">-</div>
        </div>

        <div class="profile-item">
            <div class="profile-label">Account Role</div>
            <div class="profile-value" id="role">-</div>
        </div>

        <div class="d-grid gap-2 mt-4">

            <a href="index.html"
               class="btn btn-primary">
                Go to Homepage
            </a>

            <button class="btn btn-outline-danger"
                    id="logoutButton">
                Logout
            </button>

        </div>

    </div>

</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const loggedInUser = sessionStorage.getItem("loggedInUser");

        if (!loggedInUser) {
            window.location.href = "login.html";
            return;
        }

        const user = JSON.parse(loggedInUser);

        const name = user.fullName || user.name || "User";

        document.getElementById("profileName").textContent = name;
        document.getElementById("fullName").textContent = name;
        document.getElementById("email").textContent = user.email || "Not available";
        document.getElementById("phone").textContent =
            user.phone || user.phoneNumber || "Not available";
        document.getElementById("role").textContent =
            user.role || "Not available";

        document.getElementById("logoutButton")
            .addEventListener("click", function () {

                sessionStorage.removeItem("loggedInUser");

                window.location.href = "login.html";

            });

    });

</script>

</body>
</html>
