
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Property | PropertyHub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
        background: #f1f5f9;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    .navbar-brand {
        color: #1e3a8a;
        font-size: 25px;
        font-weight: 700;
    }

    .form-container {
        max-width: 850px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .form-title {
        color: #1e3a8a;
        font-weight: 700;
    }

    .form-label {
        font-weight: 600;
    }

    #imagePreview {
        display: none;
        width: 220px;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html">PropertyHub</a>

    <a href="seller-dashboard.html"
       class="btn btn-outline-primary btn-sm">
      Back to Dashboard
    </a>
  </div>
</nav>

<div class="container">

  <div class="form-container">

    <h2 class="form-title mb-2">Add New Property</h2>

    <p class="text-muted mb-4">
      Enter your property details and upload a property photo.
    </p>

    <form id="propertyForm">

      <!-- Property Title -->
      <div class="mb-3">
        <label class="form-label">Property Title</label>
        <input type="text"
               class="form-control"
               id="title"
               placeholder="Example: 2 BHK Luxury Flat"
               required>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control"
                  id="description"
                  rows="4"
                  placeholder="Describe your property..."
                  required></textarea>
      </div>

      <!-- City and Locality -->
      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">City</label>
          <input type="text"
                 class="form-control"
                 id="city"
                 placeholder="Enter city"
                 required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Locality</label>
          <input type="text"
                 class="form-control"
                 id="locality"
                 placeholder="Enter locality"
                 required>
        </div>

      </div>

      <!-- Property Type and Listing Type -->
      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">Property Type</label>

          <select class="form-select"
                  id="propertyType"
                  required>

            <option value="">Select Property Type</option>
            <option value="FLAT">Flat</option>
            <option value="HOUSE">House</option>
            <option value="VILLA">Villa</option>
            <option value="PLOT">Plot</option>
            <option value="COMMERCIAL">Commercial</option>

          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Listing Type</label>

          <select class="form-select"
                  id="listingType"
                  required>

            <option value="">Select Listing Type</option>
            <option value="SALE">For Sale</option>
            <option value="RENT">For Rent</option>

          </select>
        </div>

      </div>

      <!-- Price -->
      <div class="mb-3">
        <label class="form-label">Price (₹)</label>

        <input type="number"
               class="form-control"
               id="price"
               min="1"
               step="0.01"
               placeholder="Enter property price"
               required>
      </div>

      <!-- Image Upload -->
      <div class="mb-4">

        <label class="form-label">Upload Property Image</label>

        <input type="file"
               class="form-control"
               id="propertyImage"
               accept="image/png, image/jpeg, image/jpg, image/webp">

        <small class="text-muted">
          Select a JPG, PNG or WEBP image.
        </small>

        <div class="mt-3">
          <img id="imagePreview"
               src=""
               alt="Property Image Preview">
        </div>

      </div>

      <!-- Bedrooms, Bathrooms and Area -->
      <div class="row">

        <div class="col-md-4 mb-3">
          <label class="form-label">Bedrooms</label>

          <input type="number"
                 class="form-control"
                 id="bedrooms"
                 min="0"
                 value="0"
                 required>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Bathrooms</label>

          <input type="number"
                 class="form-control"
                 id="bathrooms"
                 min="0"
                 value="0"
                 required>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Area (sq. ft.)</label>

          <input type="number"
                 class="form-control"
                 id="area"
                 min="1"
                 step="0.01"
                 placeholder="Area"
                 required>
        </div>

      </div>

      <div id="message" class="mb-3"></div>

      <button type="submit"
              class="btn btn-primary w-100"
              id="submitButton">

        Submit Property

      </button>

    </form>

  </div>

</div>

<script>

  document.addEventListener("DOMContentLoaded", function () {

      // Check logged-in user
      const loggedInUser = sessionStorage.getItem("loggedInUser");

      if (!loggedInUser) {
          window.location.href = "login.html";
          return;
      }

      let user;

      try {
          user = JSON.parse(loggedInUser);
      } catch (error) {
          sessionStorage.removeItem("loggedInUser");
          window.location.href = "login.html";
          return;
      }

      // Only sellers can add properties
      if (user.role !== "SELLER") {
          alert("Only sellers can add properties.");
          window.location.href = "index.html";
          return;
      }

      const propertyForm = document.getElementById("propertyForm");
      const message = document.getElementById("message");
      const submitButton = document.getElementById("submitButton");

      const propertyImage = document.getElementById("propertyImage");
      const imagePreview = document.getElementById("imagePreview");

      let selectedImage = null;

      // Image selection and preview
      propertyImage.addEventListener("change", function () {

          const file = this.files[0];

          selectedImage = null;
          imagePreview.src = "";
          imagePreview.style.display = "none";

          if (!file) {
              return;
          }

          const allowedTypes = [
              "image/jpeg",
              "image/png",
              "image/webp"
          ];

          if (!allowedTypes.includes(file.type)) {
              alert("Please select a JPG, PNG or WEBP image.");
              this.value = "";
              return;
          }

          if (file.size > 5 * 1024 * 1024) {
              alert("Image size must be less than 5 MB.");
              this.value = "";
              return;
          }

          selectedImage = file;

          const imageURL = URL.createObjectURL(file);

          imagePreview.src = imageURL;
          imagePreview.style.display = "block";

      });

      // Submit property
      propertyForm.addEventListener("submit", async function (event) {

          event.preventDefault();

          const propertyData = {

              title: document.getElementById("title").value.trim(),

              description: document.getElementById("description").value.trim(),

              city: document.getElementById("city").value.trim(),

              locality: document.getElementById("locality").value.trim(),

              propertyType: document.getElementById("propertyType").value,

              listingType: document.getElementById("listingType").value,

              price: Number(document.getElementById("price").value),

              bedrooms: Number(document.getElementById("bedrooms").value),

              bathrooms: Number(document.getElementById("bathrooms").value),

              area: Number(document.getElementById("area").value),

              ownerId: user.id

          };

          try {

              submitButton.disabled = true;
              submitButton.textContent = "Submitting...";

              message.innerHTML = "";

              // First: Create property
              const response = await fetch(
                  "/api/properties",
                  {
                      method: "POST",

                      headers: {
                          "Content-Type": "application/json"
                      },

                      body: JSON.stringify(propertyData)
                  }
              );

              const data = await response.json();

              if (!response.ok) {
                  throw new Error(
                      data.message || data.error || "Unable to add property."
                  );
              }

              // Second: Upload image if selected
              if (selectedImage) {

                  submitButton.textContent = "Uploading Image...";

                  const formData = new FormData();

                  formData.append("image", selectedImage);

                  const imageResponse = await fetch(
                      "/api/properties/" + data.id + "/image",
                      {
                          method: "POST",
                          body: formData
                      }
                  );

                  if (!imageResponse.ok) {
                      throw new Error(
                          "Property was created, but image upload failed. Please check the image upload API."
                      );
                  }
              }

              message.innerHTML = `
                  <div class="alert alert-success">
                      Property added successfully!
                      ${selectedImage ? "Property image uploaded successfully!" : ""}
                      Your property is pending admin approval.
                      Redirecting to Seller Dashboard...
                  </div>
              `;

              propertyForm.reset();

              selectedImage = null;
              imagePreview.src = "";
              imagePreview.style.display = "none";

              setTimeout(function () {
                  window.location.href = "seller-dashboard.html";
              }, 2500);

          } catch (error) {

              message.innerHTML = `
                  <div class="alert alert-danger">
                      ${error.message}
                  </div>
              `;

          } finally {

              submitButton.disabled = false;
              submitButton.textContent = "Submit Property";

          }

      });

  });

</script>

</body>
</html>
